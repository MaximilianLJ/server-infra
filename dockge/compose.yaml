services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /home/EXAMPLE_USER/srv:/home/EXAMPLE_USER/srv
    environment:
      - DOCKGE_STACKS_DIR=/home/EXAMPLE_USER/srv
      - PUID=1000
      - PGID=1000
