services:
  web:
    image: caddy:2
    container_name: shikaare-site
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: shikaare.dev
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
